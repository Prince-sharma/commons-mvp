- The discharge summary (PDF or scan)
- The final hospital bill, if available

## Steps
1. Read the document; if it is a scan, say which fields were hard to read.
2. Extract: admission date, discharge date, diagnosis, procedure, room category.
3. List every billed line item with its amount in a table.
4. If a bill is attached, check that its total matches the summary and flag any difference.
5. Return the row in the claims-sheet column order.

## Output
A table of fields, a table of line items, and a one-line total check.

## Gotchas
- Dates appear as DD/MM/YYYY and sometimes in words. Normalise them to DD-MM-YYYY.
- The interim bill is not the final bill. Ask for the final one if the totals differ.
`)},{id:"s2",kind:"new_skill",task:"t10",title:"Reconcile insurer commission statements with bookings",people:14,sessions:152,promptsPerSession:9.1,examples:["Match this insurer commission statement against our booking register and show me what doesn’t match","Policy numbers in the statement have a prefix, ignore it and match again","Now list partial matches where premium differs by more than 1%"],draftName:"commission-reconciler",draft:Et("commission-reconciler","Reconciles an insurer commission statement against the booking register and lists matched, mismatched and missing policies. Use at month end, or when someone shares a commission statement and the register.","AI team",`## Inputs
- Insurer commission statement (.xlsx/.csv)
- Booking register (.xlsx)

## Steps
1. Normalise policy numbers (strip insurer prefixes and spaces, uppercase).
2. Match on policy number, then compare premium and commission.
3. Treat a premium difference over 1% as a partial match.
4. Write three tabs: Matched, Mismatch (with the difference), Missing.

## Output
An .xlsx with three tabs and a 5-line summary.

## Gotchas
- Each insurer uses a different prefix format.
- Endorsement rows share a policy number. Match them on endorsement number too.
`)},{id:"s3",kind:"new_skill",task:"t6",title:"Translate customer replies between Hindi and English",people:27,sessions:210,promptsPerSession:3.4,examples:["Translate this reply into simple Hindi for the customer, keep the policy terms in English","Customer wrote this in Hindi, translate and tell me what they are asking","Make the Hindi more polite and shorter"],draftName:"hindi-english-replies",draft:Et("hindi-english-replies","Translates customer messages and replies between Hindi and English in Acme’s tone, keeping policy terms in English. Use when someone asks to translate a customer message or reply.","AI team",`## Steps

- The email thread
- The claim number, if it isn’t in the thread

## Steps
1. Put the messages in date order and work out who is waiting on whom.
2. List every open ask (documents, clarifications, approvals) and who owes it.
3. Give the status in one line, then the open asks as a checklist.

## Output

## Gotchas
- TPAs often reply inline. Quote-stripping can hide the newest answer.
`)},{id:"r2",name:"invoice-reconciler",author:"Neha Gupta",submitted:"5 days ago",from:"a Cowork session · Spreadsheets & data",md:Et("invoice-reconciler","Matches insurer commission statements against the booking register and lists mismatches. Use at month end.","Neha Gupta",`## Steps
